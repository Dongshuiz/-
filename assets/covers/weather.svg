<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="天气查询：城市天气与未来几天预报">
  <defs>
    <linearGradient id="wtSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12202A"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
    <radialGradient id="wtSun" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFE9B0"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" fill="url(#wtSky)"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#E8E2D4">
    <text x="40" y="52" font-size="12" letter-spacing="4" opacity=".55">WEATHER / HANGZHOU</text>
    <text x="40" y="76" font-size="9" letter-spacing="3" opacity=".3">OPEN-METEO · NO KEY</text>
  </g>
  <g transform="translate(430 150)">
    <circle r="62" fill="url(#wtSun)"/>
    <g fill="#E8E2D4" opacity=".9">
      <ellipse cx="-6" cy="52" rx="74" ry="26"/>
      <ellipse cx="28" cy="34" rx="44" ry="26"/>
    </g>
  </g>
  <g font-family="Inter, system-ui, sans-serif" fill="#E8E2D4">
    <text x="40" y="196" font-size="92" font-weight="700" letter-spacing="-4">26°</text>
    <text x="42" y="228" font-size="13" opacity=".6">晴 · 体感 27° · 湿度 62%</text>
  </g>
  <line x1="40" y1="262" x2="600" y2="262" stroke="#E8E2D4" stroke-opacity=".12"/>
  <g font-family="ui-monospace, Menlo, monospace">
    <g transform="translate(40 286)">
      <text y="0" font-size="10" fill="#E8E2D4" opacity=".4">今天</text>
      <text y="34" font-size="20" fill="#FFC24B">26°</text>
      <text y="56" font-size="9" fill="#E8E2D4" opacity=".3">18°</text>
    </g>
    <g transform="translate(180 286)">
      <text y="0" font-size="10" fill="#E8E2D4" opacity=".4">明天</text>
      <text y="34" font-size="20" fill="#E8E2D4" opacity=".8">23°</text>
      <text y="56" font-size="9" fill="#E8E2D4" opacity=".3">17°</text>
    </g>
    <g transform="translate(320 286)">
      <text y="0" font-size="10" fill="#E8E2D4" opacity=".4">周三</text>
      <text y="34" font-size="20" fill="#E8E2D4" opacity=".8">21°</text>
      <text y="56" font-size="9" fill="#E8E2D4" opacity=".3">16°</text>
    </g>
    <g transform="translate(460 286)">
      <text y="0" font-size="10" fill="#E8E2D4" opacity=".4">周四</text>
      <text y="34" font-size="20" fill="#E8E2D4" opacity=".8">24°</text>
      <text y="56" font-size="9" fill="#E8E2D4" opacity=".3">19°</text>
    </g>
    <text x="600" y="388" font-size="10" letter-spacing="2.4" opacity=".3" text-anchor="end">GEO · FAVORITES</text>
  </g>
</svg>
